# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=payment-VNPay
server.port=${SERVER_PORT:8080}

# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:payment_vnpay_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:vnpay_user}
spring.datasource.password=${DB_PASSWORD:vnpay_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# VNPay Sandbox Configuration
# ===================================================================
vnpay.tmnCode=${VNPAY_TMN_CODE:DEMOVNPAY}
vnpay.hashSecret=${VNPAY_HASH_SECRET:DEMOHASHSECRETKEY}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.ipnUrl=${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay-ipn}
